<!DOCTYPE html>

<!--
    CST-120 Milestone 5 - Map Page
    This page allows visitors to switch between different maps of Avelis.
    Shared site styling is stored in styles.css, while map-specific
    layout remains on this page.
    JavaScript behavior is stored externally in js/map.js.
-->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Avelis | Maps</title>

    <link rel="stylesheet" href="styles.css">

    <style>

        /* Map page introduction */

        .map-intro {
            max-width: 850px;
            margin: 0 auto 30px auto;
            text-align: center;
        }

        .map-heading {
            font-family: "Samantha Handwriting", cursive;
            font-size: 40px;
        }


        /*
            Flexbox keeps the map buttons in one row when space is available.
            flex-wrap allows them to move onto another line on smaller screens,
            while gap keeps even spacing between each button.
        */

        .map-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .map-buttons button {
            padding: 10px 18px;
            font-family: "Samantha Handwriting", cursive;
            font-size: 22px;
            color: #3e2d20;
            background-color: #e2c99d;
            border: 1px solid #8f8064;
            border-radius: 4px;
            cursor: pointer;
            transition:
                transform 0.3s ease,
                background-color 0.3s ease;
        }

        .map-buttons button:hover,
        .map-buttons button:focus {
            transform: scale(1.05);
            background-color: #d3b47b;
        }


        /*
            The active button receives a stronger visual state
            that matches its aria-pressed value.
        */

        .map-buttons button.active-map {
            background-color: #c49a5a;
            border: 2px solid #6f5137;
        }


        /* Map display */

        .map-display {
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        .map-display img {
            width: 100%;
            max-width: 1000px;
            height: auto;
            display: block;
            margin: 0 auto;
            border: 2px solid #8f8064;
        }

        .map-title {
            margin-top: 15px;
            font-family: "Samantha Handwriting", cursive;
            font-size: 32px;
        }


        /* Responsive map layout */

        @media (max-width: 800px) {

            .map-buttons {
                flex-direction: column;
                align-items: center;
            }

            .map-buttons button {
                width: 200px;
            }
        }


        /*
            Accessibility:
            Button motion is reduced when the user's device requests
            a reduced-motion experience.
        */

        @media (prefers-reduced-motion: reduce) {

            .map-buttons button {
                transition-duration: 0.01ms;
            }

            .map-buttons button:hover,
            .map-buttons button:focus {
                transform: none;
            }
        }

    </style>

</head>


<body>

    <!-- Shared site header -->

    <header>
        <h1>Avelis</h1>
    </header>


    <div class="page-layout">

        <!-- Main site navigation -->

        <nav aria-label="Main navigation">

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="characters.html">Characters</a></li>
                <li><a href="map.html">World Map</a></li>
                <li><a href="#">Calendar</a></li>
                <li><a href="lore.html">Lore Archive</a></li>
                <li><a href="#">Books and Stories</a></li>
            </ul>

        </nav>


        <main>

            <!-- Map page introduction -->

            <section class="map-intro">

                <h2 class="map-heading">
                    Maps of Avelis
                </h2>

                <p>
                    Explore Avelis through different views of the world.
                    Select a map below to view cities, geography, or
                    political boundaries.
                </p>

            </section>


            <!--
                Map selection buttons.

                aria-pressed communicates which map option is currently
                selected to assistive technology.
            -->

            <section
                class="map-buttons"
                aria-label="Choose a map of Avelis"
            >

                <button
                    type="button"
                    data-map="city"
                    aria-pressed="true"
                    aria-controls="map-image"
                    class="active-map"
                >
                    City Map
                </button>

                <button
                    type="button"
                    data-map="geography"
                    aria-pressed="false"
                    aria-controls="map-image"
                >
                    Geography Map
                </button>

                <button
                    type="button"
                    data-map="political"
                    aria-pressed="false"
                    aria-controls="map-image"
                >
                    Political Map
                </button>

            </section>


            <!-- Current map -->

            <section
                class="map-display"
                aria-label="Selected map"
            >

                <img
                    id="map-image"
                    src="images/City-Map.jpeg"
                    alt="City Map of Avelis"
                >

                <!--
                    aria-live announces the new map title when
                    JavaScript changes the selected map.
                -->

                <h3
                    id="map-title"
                    class="map-title"
                    aria-live="polite"
                >
                    Viewing: City Map
                </h3>

            </section>

        </main>

    </div>


    <!-- Shared site footer -->

    <footer>
        <p>Avelis World Companion</p>
    </footer>


    <!--
        Milestone 5 uses external JavaScript.
        The script is placed after the page content so the map
        controls exist before map.js attaches its event listeners.
    -->

    <script src="js/map.js"></script>

</body>

</html>
